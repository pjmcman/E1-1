# 보너스: 웹(custom nginx) + 보조 API 서비스 멀티 컨테이너
services:
  web:
    build: .
    image: e1-1-web:compose
    ports:
      - "${WEB_PORT:-8090}:80"     # 환경 변수로 호스트 포트 변경 가능
    depends_on:
      - api

  api:
    image: python:3.12-alpine
    working_dir: /srv
    volumes:
      - ./compose/api:/srv:ro
    environment:
      - API_PORT=${API_PORT:-8000}
      - APP_MODE=${APP_MODE:-dev}
    command: ["python", "-u", "server.py"]
